# Copy to profile.yaml and edit. profile.yaml is gitignored and never leaves
# your machine — it holds your rate floor, your resume, and your opinions about
# employers, none of which belong in a public repo.
#
# This example is a fictional person so the repo is runnable out of the box.

identity:
  name: Sam Okafor
  based_in: Lagos, Nigeria
  utc_offset: 1

regions:
  # These only matter when a listing DOES restrict hiring. A listing with an
  # empty restriction list is unrestricted, and that is the good case.
  allow:
    - Nigeria
    - Africa
    - EMEA
    - Anywhere in the World
    - Worldwide
    - Global
  deny: []
  # Listings restricted to your OWN country often come from local-market
  # employers paying local rates. Not rejected — flagged, and the scorer is
  # told to treat it as a downward signal.
  local_anchor: [Nigeria]

timezone:
  # Accept a listing if its required UTC offsets intersect this set. An empty
  # requirement on the listing always passes.
  accept: [0, 1, 2, 3, 4, 5]

rate:
  # What you ask for. Not a reject line — the scorer weighs distance from it.
  target_hourly_usd: 40

  # Reject only what is CERTAINLY below this. Never reject on a missing or
  # ambiguous salary: most listings state none at all.
  #
  # Worth setting this by direction. When you approach them, a cold
  # application is a weaker position and a lower floor surfaces work you can
  # start now and grow out of. When they approach you, hold the higher number.
  # This tool reads postings you would apply to, so it is the outbound case.
  absolute_floor_hourly_usd: 30

  # Presentation only. Splits the digest into "Apply now" and "Worth the ask"
  # so a low floor never hides which listings are worth pushing on rate.
  inbound_floor_hourly_usd: 45

roles:
  # An include list is a tradeoff, not a default. It saves tokens, but a regex
  # is worst at exactly what a human reads a title for: an "AI Engineer" list
  # will happily discard "Conversational AI & Voice AI Specialist".
  #
  # Count how many jobs actually reach this stage before you rely on it. If
  # the earlier stages already cut the pool to a few dozen a day, set
  # `include: []`, keep only the impossible in `exclude`, and let the scorer
  # rank. It reads titles better than you can pattern-match them.
  include:
    - backend
    - full.?stack
    - platform engineer
    - devops
    - site reliability
  exclude:
    - intern
    - unpaid
    - commission only
    - sales
    - recruiter

  # Rejected UNLESS the listing states a rate that clears your floor. For
  # titles worth taking when the money is real, and not worth an application
  # when it is unstated. Relies on stage order: `salary` runs before `role`,
  # so a stated rate below the floor is already gone by this point.
  exclude_unless_paid: []

employers:
  # Hard reject. Usually better left empty — never seeing a listing is not a
  # decision you get to make later.
  blocklist: []

  # Outsourcing middlemen and body shops that quote local rates. These still
  # reach the scorer, which marks them down and explains why, so the tradeoff
  # is judged per posting rather than by a blanket veto.
  flag: []

# Per-board policy. Boards are isolated: a score, a rate floor and an age
# window are only meaningful within the board they came from, because the
# boards genuinely behave differently. On the author's own data, the same
# rubric and the same model average 20.3 on one board and 5.9 on another.
#
# `defaults` fills in what a board omits. A board with NO block at all is a
# hard error rather than a silent inherit, so a new source cannot quietly
# adopt another board's tuning.
boards:
  defaults:
    display_threshold: 60
    draft_at: 75          # score at or above which a letter is auto-drafted
    absolute_floor_hourly_usd: 30
    max_age_days: 21      # null to never trim by age on a board

  himalayas:
    draft_at: 75

  onlinejobs:
    # A domestic board pays local rates, so it carries its own floor rather
    # than being judged against the international one.
    absolute_floor_hourly_usd: 15
    max_age_days: 7

  indeed:
    # ph.indeed.com is a domestic board too, so the same local-rate floor as
    # onlinejobs, not the international one.
    absolute_floor_hourly_usd: 15
    # Neither region nor salary is authoritative here (sources/indeed.py), so
    # the deterministic stages eliminate almost nothing and nearly every
    # capture reaches the scorer. display_threshold 0 keeps the whole thin
    # board visible in the digest instead of hiding it behind a bar tuned for
    # boards where the funnel already did the culling.
    display_threshold: 0
    # Lower than the 75 default: measured 2026-09-03 the best-scoring listing
    # on this board landed at 75 (docs/indeed-capture.md), so 75 would draft
    # nothing on a board that only yields ~15 listings a week.
    draft_at: 70
    # A capture is a photograph taken by hand, not a daily crawl -- matches
    # the `fromage=7` search window it was captured with, not a longer default
    # tuned for a board that refreshes itself.
    max_age_days: 7

scoring:
  # Point this at your own CV as plain text or markdown.
  resume_path: examples/resume.example.md
  # Display filter only. Every scored job is stored regardless, so that
  # changing this number never rewrites history.
  display_threshold: 60

# What a posting can demand that you cannot hand over.
#
# These are the ASKS a listing makes of an applicant, not skills. Discover what
# is actually being asked with `py report.py`, which tallies every requirement
# seen across your stored history and marks the ones you have flagged.
#
# A key here never rejects a listing -- it lowers the score by blocker_penalty
# for each MANDATORY ask you cannot meet, because a listing sometimes restates
# a "requirement" it does not enforce, and you are the one who knows which.
# Raise blocker_penalty to bury them instead.
#
# Nothing in this section is ever sent to the API. Matching happens locally, so
# editing this list re-flags your whole history with no re-scoring.
#
# Valid keys are the ones in config.REQUIREMENT_KINDS:
#   work_samples  public_code  video_intro
#   test_task  timed_trial  certification  degree  years_experience
#   references  named_clients  own_tooling  equipment  time_tracker
#   background_check  id_verification  language_other  onsite_presence
deliverables:
  cannot_provide:
    - work_samples            # client work is under NDA, nothing is showable
    - named_clients

  # Things you CAN supply, but not without doing something first. These NEVER
  # affect the score: a posting is not worth less because it wants a video, it
  # just needs a step from you before you can apply. Both the digest entry and
  # the drafted cover letter carry the checklist.
  needs_manual_step:
    - video_intro
    - test_task
  blocker_penalty: 30
